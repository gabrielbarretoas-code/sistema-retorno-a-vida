<html lang="pt-BR">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Sistema Retorno à Vida</title>
<style>
:root{
  --bg:#f4f6fa; --card:#ffffff; --ink:#1a2233; --ink2:#5a6478; --line:#e4e8f0;
  --azul:#1a3a5c; --azul2:#2d5f8f; --dourado:#b8860b; --verde:#1b6e3c; --verm:#b3261e;
  --laranja:#c46a00; --roxo:#5b3a8e;
  --shadow:0 2px 10px rgba(20,30,60,.08);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
body.dark{--bg:#0f1420;--card:#1a2130;--ink:#e8ecf4;--ink2:#9aa4ba;--line:#2a3348;--shadow:0 2px 10px rgba(0,0,0,.4)}
/* ===== LAYOUT ===== */
.app{display:flex;min-height:100vh}
.side{width:230px;background:var(--azul);color:#fff;padding:18px 0;position:fixed;top:0;bottom:0;left:0;display:flex;flex-direction:column;z-index:50}
.logo{padding:0 18px 16px;border-bottom:1px solid rgba(255,255,255,.15)}
.logo h1{font-size:17px;font-weight:800;letter-spacing:.3px}
.logo p{font-size:10.5px;opacity:.75;margin-top:3px}
.nav{flex:1;padding:10px 8px;overflow-y:auto}
.nav button{display:flex;align-items:center;gap:10px;width:100%;background:none;border:none;color:rgba(255,255,255,.75);padding:11px 12px;border-radius:10px;font-size:14px;cursor:pointer;text-align:left;font-family:inherit}
.nav button.on{background:rgba(255,255,255,.16);color:#fff;font-weight:600}
.nav .ic{font-size:17px;width:22px;text-align:center}
.sidefoot{padding:12px 18px;border-top:1px solid rgba(255,255,255,.15);font-size:10.5px;opacity:.7}
.main{flex:1;margin-left:230px;padding:18px 30px 90px;max-width:none}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.topbar h2{font-size:21px;font-weight:800}
.topbar .sub{font-size:12px;color:var(--ink2);margin-top:2px}
.tb-actions{display:flex;gap:8px;align-items:center}
.iconbtn{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:15px;cursor:pointer;color:var(--ink)}
/* ===== MOBILE ===== */
@media(max-width:760px){
  .side{display:none}
  .main{margin-left:0;padding:14px 14px 100px}
  .bottomnav{display:flex !important}
}
.bottomnav{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);z-index:60;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.bottomnav button{flex:1;background:none;border:none;font-size:10px;color:var(--ink2);cursor:pointer;padding:4px 0;font-family:inherit}
.bottomnav button.on{color:var(--azul2);font-weight:700}
.bottomnav .bic{font-size:19px;display:block;margin-bottom:2px}
/* ===== COMPONENTES ===== */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
.card h3{font-size:14px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:7px}
.card h3 .tag{margin-left:auto}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
@media(max-width:900px){.grid3{grid-template-columns:1fr 1fr}}
@media(max-width:640px){.grid3{grid-template-columns:1fr}}
@media(max-width:640px){.grid2{grid-template-columns:1fr}}
.hero{background:linear-gradient(135deg,var(--azul),var(--azul2));color:#fff;border:none;border-radius:16px;padding:20px;margin-bottom:14px}
.hero .lbl{font-size:11px;letter-spacing:1.2px;text-transform:uppercase;opacity:.8}
.hero .acao{font-size:19px;font-weight:800;line-height:1.35;margin:8px 0 14px}
.hero .btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:none;border-radius:10px;padding:11px 16px;font-size:13.5px;font-weight:700;cursor:pointer;font-family:inherit}
.btn.p{background:#fff;color:var(--azul)}
.btn.s{background:rgba(255,255,255,.18);color:#fff;border:1px solid rgba(255,255,255,.35)}
.btn.g{background:var(--verde);color:#fff}
.btn.o{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.d{background:var(--verm);color:#fff}
.btn.sm{padding:7px 11px;font-size:12px}
.tag{display:inline-block;font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:20px;background:var(--bg);border:1px solid var(--line);color:var(--ink2)}
.tag.p0{background:#fdecec;color:var(--verm);border-color:#f5c6c2}
.tag.p1{background:#fff4e5;color:var(--laranja);border-color:#f0d9b8}
.tag.p2{background:#eef3fb;color:var(--azul2);border-color:#d4e0f0}
.tag.ok{background:#e8f5ee;color:var(--verde);border-color:#c2e3cf}
.tag.area{background:#f3eefb;color:var(--roxo);border-color:#e0d4f2}
.insight{background:linear-gradient(135deg,#fff8e8,#fdf0d5);border:1px solid #eadfb8;border-radius:14px;padding:16px;margin-bottom:14px}
body.dark .insight{background:linear-gradient(135deg,#2a2410,#241f0e);border-color:#4a3f1a}
.insight .ilbl{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:#8a6d1a;font-weight:800}
body.dark .insight .ilbl{color:#d4b34a}
.insight .itxt{font-size:14.5px;line-height:1.5;margin-top:7px;font-weight:600}
.insight .isrc{font-size:11px;color:var(--ink2);margin-top:8px;font-style:italic}
.despejo{display:flex;gap:8px;margin-bottom:14px}
.despejo textarea{flex:1;resize:none;border:1.5px solid var(--line);border-radius:12px;padding:12px;font-size:14px;font-family:inherit;background:var(--card);color:var(--ink);min-height:52px}
.despejo textarea:focus{outline:none;border-color:var(--azul2)}
.despejo button{align-self:flex-end}
.item{display:flex;gap:10px;align-items:flex-start;padding:11px 4px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:none}
.item .cb{width:22px;height:22px;border-radius:7px;border:2px solid var(--line);background:none;cursor:pointer;flex-shrink:0;font-size:13px;line-height:1;color:#fff;margin-top:1px}
.item .cb.done{background:var(--verde);border-color:var(--verde)}
.item .tx{flex:1;min-width:0}
.item .tt{font-size:14px;font-weight:600;line-height:1.35}
.item.done .tt{text-decoration:line-through;color:var(--ink2);font-weight:500}
.item .meta{font-size:11.5px;color:var(--ink2);margin-top:3px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.item .act{background:none;border:none;cursor:pointer;font-size:15px;color:var(--ink2);padding:4px}
.barra{height:9px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:6px}
.barra i{display:block;height:100%;border-radius:6px;transition:width .5s}
.frente{margin-bottom:12px}
.frente .fl{display:flex;justify-content:space-between;font-size:12.5px;font-weight:600;margin-bottom:2px}
.frente .fl span:last-child{color:var(--ink2)}
.saldo{font-size:30px;font-weight:800;letter-spacing:-.5px}
.saldo.pos{color:var(--verde)}
.saldo.neg{color:var(--verm)}
.lanc{display:flex;justify-content:space-between;padding:9px 2px;border-bottom:1px solid var(--line);font-size:13.5px}
.lanc:last-child{border:none}
.lanc .v{font-weight:700}
.lanc .v.neg{color:var(--verm)}
.lanc .v.pos{color:var(--verde)}
.lanc .d{color:var(--ink2);font-size:11.5px;margin-top:2px}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--line);border-radius:22px;padding:6px 12px;font-size:12px;font-weight:600;margin:0 6px 8px 0}
.pill .dot{width:9px;height:9px;border-radius:50%}
.rotina .bl{display:flex;gap:10px;padding:9px 2px;border-bottom:1px solid var(--line);font-size:13px}
.rotina .bl:last-child{border:none}
.rotina .hr{font-weight:800;color:var(--azul2);width:86px;flex-shrink:0;font-size:12.5px}
.rotina .sag{color:var(--dourado);font-weight:700}
.msg{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;font-size:13px;line-height:1.45}
.msg .mh{font-size:11px;color:var(--ink2);margin-bottom:4px;font-weight:600}
.empty{text-align:center;color:var(--ink2);font-size:13px;padding:26px 10px}
.banner{background:#e8f5ee;border:1px solid #c2e3cf;color:var(--verde);border-radius:12px;padding:12px 14px;margin-bottom:14px;font-size:13.5px;font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:10px}
.fab{position:fixed;right:18px;bottom:84px;background:var(--azul);color:#fff;border:none;border-radius:50%;width:52px;height:52px;font-size:22px;cursor:pointer;box-shadow:0 4px 14px rgba(20,30,60,.3);z-index:55}
.modal{position:fixed;inset:0;background:rgba(10,15,30,.55);z-index:100;display:none;align-items:flex-end;justify-content:center}
.modal.open{display:flex}
.mbox{background:var(--card);border-radius:18px 18px 0 0;padding:20px;width:100%;max-width:520px;max-height:85vh;overflow-y:auto}
@media(min-width:761px){.modal{align-items:center}.mbox{border-radius:18px}}
.mbox h3{font-size:16px;margin-bottom:12px}
.mbox label{display:block;font-size:12px;font-weight:700;color:var(--ink2);margin:10px 0 5px}
.mbox input,.mbox select,.mbox textarea{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px;font-size:14px;font-family:inherit;background:var(--bg);color:var(--ink)}
.mbox input:focus,.mbox select:focus,.mbox textarea:focus{outline:none;border-color:var(--azul2)}
.mrow{display:flex;gap:8px;margin-top:16px}
.mrow .btn{flex:1}

/* ===== v6: gráficos ===== */
.grafico{margin-top:10px}
.donut-wrap{display:flex;align-items:center;gap:14px}
.donut{--p:0;width:84px;height:84px;border-radius:50%;background:conic-gradient(var(--azul2) calc(var(--p)*1%), rgba(127,127,127,.18) 0);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.donut i{width:58px;height:58px;border-radius:50%;background:var(--card,#fff);display:flex;flex-direction:column;align-items:center;justify-content:center;font-style:normal}
.donut b{font-size:16px;line-height:1}
.donut small{font-size:9px;opacity:.7}
.barras{display:flex;align-items:flex-end;gap:10px;height:110px;padding:0 4px;border-bottom:1px solid rgba(127,127,127,.25)}
.barras .b{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.barras .col{width:100%;max-width:56px;border-radius:6px 6px 0 0;background:var(--azul2)}
.barras .col.neg{background:#b3261e}
.barras .lbl{font-size:10.5px;opacity:.75;white-space:nowrap}
.barras .val{font-size:10.5px;font-weight:700}
.anel-dia{display:flex;align-items:center;gap:12px}
.mini{--p:0;width:64px;height:64px;border-radius:50%;background:conic-gradient(#1b6e3c calc(var(--p)*1%), rgba(127,127,127,.18) 0);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.mini i{width:44px;height:44px;border-radius:50%;background:var(--card,#fff);display:flex;flex-direction:column;align-items:center;justify-content:center;font-style:normal}
.mini b{font-size:13px}
.mini small{font-size:8.5px;opacity:.7}

/* ===== GRAFICOS v5.2 ===== */
.donut{width:150px;height:150px;border-radius:50%;background:conic-gradient(var(--azul2) 0deg, var(--azul2) var(--a), #e8e6e0 var(--a), #e8e6e0 360deg);display:flex;align-items:center;justify-content:center;margin:0 auto}
.donut::before{content:'';position:absolute;width:106px;height:106px;border-radius:50%;background:var(--card)}
.donut span{position:relative;z-index:1;font-weight:800;font-size:20px;color:var(--ink)}
.grafbox{margin-top:10px}
.barras{display:flex;align-items:flex-end;gap:6px;height:90px;padding:8px 4px 0}
.barra-v{flex:1;background:var(--verde);border-radius:6px 6px 0 0;min-height:4px;position:relative}
.barra-v.neg{background:var(--verm)}
.barra-v .bv{position:absolute;top:-16px;left:50%;transform:translateX(-50%);font-size:9.5px;font-weight:700;color:var(--ink2);white-space:nowrap}
.barra-lbl{text-align:center;font-size:10px;color:var(--ink2);margin-top:3px}

/* ===== GRÁFICOS v5.2 ===== */
.gwrap{display:flex;gap:14px;align-items:center}
.anel{width:92px;height:92px;flex:none;position:relative}
.anel svg{width:100%;height:100%;transform:rotate(-90deg)}
.anel .pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px}
.gbars{display:flex;align-items:flex-end;gap:8px;height:110px;padding:6px 2px 0}
.gbar{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.gbar .cols{display:flex;gap:3px;align-items:flex-end;width:100%;justify-content:center;height:86px}
.gbar .c{width:16px;border-radius:4px 4px 0 0}
.gbar .dia{font-size:10px;color:var(--ink2)}
.gbar .leg{font-size:9.5px;color:var(--ink2);display:flex;gap:8px;margin-top:2px}
.gleg{display:flex;gap:10px;font-size:11px;color:var(--ink2);margin-top:6px}
.gdot{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px}
</style>
</head>

function flush(){
  if(!(S.outbox&&S.outbox.length)) return;
  const item=S.outbox[0];
  const body=JSON.stringify({source:item.source,device:item.device,ts:item.h,text:item.text||'',actions:item.actions||[],stats:{pend:CLOUD.demandas.filter(d=>d.status==='aberta'&&!S.feito[d.id]).length,saldo:CLOUD.financeiro.saldo}});
  try{
    fetch(WEBHOOK+'?secret='+SECRET,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:body})
    .then(()=>{S.outbox.shift();save();if(S.outbox.length)setTimeout(flush,800);else if(aba==='circuito')render();})
    .catch(()=>{});
  }catch(e){}
}
