name: Verify published Pages assets
on:
  push:
    branches: [main]
    paths:
      - '*.html'
      - '*.js'
      - '*.css'
      - 'scripts/verify-pages.py'
      - '.github/workflows/verify-pages.yml'
permissions:
  contents: read
concurrency:
  group: pages-asset-verification
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Read back the public release and compare all asset hashes
        run: python3 scripts/verify-pages.py
